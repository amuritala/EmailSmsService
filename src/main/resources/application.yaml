spring:
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    from: ${SMTP_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SMTP_STARTTLS}
          ssl:
            enable: ${SMTP_SSL}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  application:
    name: corebanking
